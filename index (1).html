<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setup Scanner</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F8;--pn:#FFFFFF;--tx:#14223A;--mu:#5A6B87;--ac:#B26A00;--up:#1B8A5E;--dn:#C23F2E;--ln:#D7DFEB;--wn:#FFF3DC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1C33;--pn:#172844;--tx:#E6EDF8;--mu:#93A6C4;--ac:#F0B34A;--up:#3DBE8B;--dn:#EE6A57;--ln:#26395A;--wn:#2D2A22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1C33;--pn:#172844;--tx:#E6EDF8;--mu:#93A6C4;--ac:#F0B34A;--up:#3DBE8B;--dn:#EE6A57;--ln:#26395A;--wn:#2D2A22;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding-bottom:88px;font-variant-numeric:tabular-nums}
.w{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;object-fit:contain;border-radius:8px}
h1{font-size:22px;margin:0;font-weight:700}
#sp{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#sp img{width:150px;height:150px;object-fit:contain}
#sp b{font-size:22px}
.mu{color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1.5px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:999px;padding:4px 15px;font:inherit;font-size:15px;font-weight:600}
.chip.on{border-color:var(--ac);color:var(--ac)}
.chips.s .chip{border-radius:8px;padding:3px 12px;font-size:14px}
.price{font-size:34px;font-weight:700;line-height:1.1;margin:12px 0 6px}
.reg{display:inline-block;padding:2px 12px;border-radius:8px;font-weight:600;font-size:14px;background:var(--wn);color:var(--ac)}
#cv{width:100%;height:260px;display:block;margin:12px 0;background:var(--pn);border:1px solid var(--ln);border-radius:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
.card.act{border-left:5px solid var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font-size:16px}
.tag{font-size:13px;font-weight:600;color:var(--mu);flex:none}
.tag.on{color:var(--up)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.plan div{background:var(--bg);border-radius:10px;padding:8px 10px}
.plan span,.kv span{display:block;font-size:12.5px;color:var(--mu)}
.plan b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kv b{font-size:15px}
.meter{height:7px;border-radius:4px;background:var(--ln);margin:10px 0 2px;position:relative;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac)}
.meter u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.5}
.note{font-size:13.5px;color:var(--mu);margin:6px 0 0}
.warn{background:var(--wn);border-radius:10px;padding:9px 12px;font-size:14px;margin:12px 0}
.best{border:2px solid var(--ac)}
.best h2{margin:0 0 2px;font-size:15px;color:var(--ac)}
.up{color:var(--up)}.dn{color:var(--dn)}
.tbl{background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin:12px 0}
.tr{display:grid;grid-template-columns:1fr 34px 42px 40px 50px;gap:6px;padding:7px 12px;font-size:13px;border-top:1px solid var(--ln);align-items:center}
.tr.h{color:var(--mu);font-size:12px;border-top:0}
.tr .v{color:var(--up);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:16px;padding:14px 0}
.tabs button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.foot{font-size:13px;color:var(--mu);margin:18px 0 0}
</style>
</head>
<body>
<div id="sp"><img src="logo.png" alt="" onerror="document.getElementById('sp').remove()"><b>Setup Scanner</b></div>
<div class="w" style="padding-bottom:0"><div class="top"><img src="logo.png" alt="" onerror="this.remove()"><h1>Setup Scanner</h1></div></div>
<div class="w" id="app" style="padding-top:4px"></div>
<div class="tabs"><button id="t-live" onclick="go('live')">Live</button><button id="t-str" onclick="go('str')">Strategies</button></div>
<script>
setTimeout(()=>{const s=document.getElementById('sp');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500)}},1500);
const A={BTC:['BTCUSDT','Bitcoin',90000],ETH:['ETHUSDT','Ethereum',3000],SOL:['SOLUSDT','Solana',150],LINK:['LINKUSDT','Chainlink',15],GOLD:['PAXGUSDT','Gold (PAXG token)',4000]};
const TF={'15m':'15m','30m':'30m','1h':'1h','4h':'4h','1d':'1D'},TH={'15m':.25,'30m':.5,'1h':1,'4h':4,'1d':24};
const RISK=[[1.5,2],[2,2],[1.5,3],[1,1.5]];
let st={a:'BTC',tf:'15m',tab:'live',r:null,busy:true,vo:false};
const $=s=>document.querySelector(s);
const fp=p=>p.toLocaleString('en-US',{maximumFractionDigits:p<1?5:p<100?3:2});

function rma(v,p){const o=new Array(v.length).fill(NaN);let s=0;for(let i=0;i<v.length;i++){if(i<p){s+=v[i];if(i===p-1)o[i]=s/p}else o[i]=(o[i-1]*(p-1)+v[i])/p}return o}
function ema(v,p){const k=2/(p+1),o=[];let e=v[0];for(let i=0;i<v.length;i++){e=i?v[i]*k+e*(1-k):v[0];o.push(e)}return o}
function sma(v,p){const o=[];let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];o.push(i>=p-1?s/p:NaN)}return o}
function atrF(h,l,c,p){return rma(h.map((x,i)=>i?Math.max(x-l[i],Math.abs(x-c[i-1]),Math.abs(l[i]-c[i-1])):x-l[i]),p)}
function rsiF(c,p=14){const g=[0],q=[0];for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];g.push(d>0?d:0);q.push(d<0?-d:0)}const ag=rma(g,p),al=rma(q,p);return c.map((_,i)=>al[i]===0?100:100-100/(1+ag[i]/al[i]))}
function adxF(h,l,c,p=14){const n=c.length,pd=[0],md=[0],tr=[h[0]-l[0]];for(let i=1;i<n;i++){const u=h[i]-h[i-1],d=l[i-1]-l[i];pd.push(u>d&&u>0?u:0);md.push(d>u&&d>0?d:0);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))}
const at=rma(tr,p),rp=rma(pd,p),rm=rma(md,p),pdi=[],mdi=[],dx=[];for(let i=0;i<n;i++){const P=100*rp[i]/at[i],M=100*rm[i]/at[i];pdi.push(P);mdi.push(M);const s=P+M;dx.push(isNaN(s)||!s?0:100*Math.abs(P-M)/s)}return{pdi,mdi,adx:rma(dx,p)}}
function boll(c,p=20,k=2){const mid=[],up=[],lo=[];for(let i=0;i<c.length;i++){if(i<p-1){mid.push(NaN);up.push(NaN);lo.push(NaN);continue}let s=0;for(let j=i-p+1;j<=i;j++)s+=c[j];const m=s/p;let v=0;for(let j=i-p+1;j<=i;j++)v+=(c[j]-m)**2;const sd=Math.sqrt(v/p);mid.push(m);up.push(m+k*sd);lo.push(m-k*sd)}return{mid,up,lo}}
function supertrend(h,l,c,a,m){const n=c.length,line=new Array(n).fill(NaN),dir=new Array(n).fill(1);let fu=0,fl=0;for(let i=0;i<n;i++){if(isNaN(a[i]))continue;const hl=(h[i]+l[i])/2,bu=hl+m*a[i],bl=hl-m*a[i];if(i===0||isNaN(line[i-1])){fu=bu;fl=bl;dir[i]=1}else{fu=(bu<fu||c[i-1]>fu)?bu:fu;fl=(bl>fl||c[i-1]<fl)?bl:fl;dir[i]=dir[i-1];if(dir[i-1]===1&&c[i]<fl)dir[i]=-1;else if(dir[i-1]===-1&&c[i]>fu)dir[i]=1}line[i]=dir[i]===1?fl:fu}return{line,dir}}

function demo(key,tf){let s=0;for(const ch of key+tf)s=s*31+ch.charCodeAt(0)>>>0;
const rnd=()=>{s=s+0x6D2B79F5>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const vol=0.006*Math.sqrt(TH[tf]),ms=TH[tf]*36e5,N=3000;let p=A[key][2],anc=p,mu=0,side=false,k=[],t=Date.now()-N*ms;
for(let i=0;i<N;i++){if(i%150===0){side=rnd()<0.4;mu=(rnd()-0.5)*0.003*Math.sqrt(TH[tf]);anc=p}
const z=(rnd()+rnd()+rnd()-1.5)*2*vol,r=side?-0.06*Math.log(p/anc)+z:mu+z,o=p,c=p*Math.exp(r);
k.push([t+i*ms,o,Math.max(o,c)*(1+rnd()*vol*.5),Math.min(o,c)*(1-rnd()*vol*.5),c]);p=c}return k}

async function getK(key,tf){
for(const b of ['https://api.binance.com','https://data-api.binance.vision']){
let all=[],end=0;
try{for(let p=0;p<3;p++){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
const r=await fetch(b+'/api/v3/klines?symbol='+A[key][0]+'&interval='+tf+'&limit=1000'+(end?'&endTime='+end:''),{signal:ac.signal});clearTimeout(t);
if(!r.ok)break;const j=await r.json();if(!Array.isArray(j)||!j.length)break;
const m=j.map(x=>[+x[0],+x[1],+x[2],+x[3],+x[4]]);all=m.concat(all);end=m[0][0]-1}}catch(e){}
if(all.length>300)return{k:all,demo:false}}
return{k:demo(key,tf),demo:true}}

function bt(sig,x,from){const tr=[];let i=from;
while(i<x.n-1){const s=sig[i];if(!s){i++;continue}
const risk=Math.abs(s.e-s.sl);let j=i+1,r=null;
for(;j<x.n&&j<=i+100;j++){const hit=s.d>0?x.l[j]<=s.sl:x.h[j]>=s.sl,tp=s.d>0?x.h[j]>=s.tp:x.l[j]<=s.tp;
if(hit){r=-1;break}if(tp){r=Math.abs(s.tp-s.e)/risk;break}}
if(r===null){if(j>=x.n)break;r=(x.c[j]-s.e)*s.d/risk}
tr.push({r,i,reg:x.adx[i]>=22?'t':'s'});i=j+1}return tr}

function stats(tr){const n=tr.length;if(!n)return{n:0};let gp=0,gl=0,w=0,cum=0,pk=0,dd=0;
tr.forEach(t=>{if(t.r>0){w++;gp+=t.r}else gl-=t.r;cum+=t.r;pk=Math.max(pk,cum);dd=Math.max(dd,pk-cum)});
return{n,wr:w/n,pf:gl?gp/gl:null,ex:cum/n,dd}}

function analyze(k){
const cl=k.slice(0,-1),live=k[k.length-1][4],n=cl.length,o=cl.map(x=>x[1]),h=cl.map(x=>x[2]),l=cl.map(x=>x[3]),c=cl.map(x=>x[4]);
const a=atrF(h,l,c,14),a10=atrF(h,l,c,10),e9=ema(c,9),e20=ema(c,20),e21=ema(c,21),e50=ema(c,50),e200=ema(c,200),s10=sma(c,10),s30=sma(c,30);
const ad=adxF(h,l,c),rs=rsiF(c),rs2=rsiF(c,2),bb=boll(c),t1=supertrend(h,l,c,a10,3),t2=supertrend(h,l,c,a10,2);
const m12=ema(c,12),m26=ema(c,26),mc=m12.map((v,i)=>v-m26[i]),ms=ema(mc,9),hs=mc.map((v,i)=>v-ms[i]);
const raw=c.map((v,i)=>{if(i<13)return 50;let H=-Infinity,L=Infinity;for(let j=i-13;j<=i;j++){if(h[j]>H)H=h[j];if(l[j]<L)L=l[j]}return H===L?50:(v-L)/(H-L)*100});
const K=sma(raw,3).map(v=>isNaN(v)?50:v),D=sma(K,3).map(v=>isNaN(v)?50:v);
const tp=c.map((v,i)=>(h[i]+l[i]+v)/3),tm=sma(tp,20),cc=tp.map((v,i)=>{if(i<19)return 0;let md=0;for(let j=i-19;j<=i;j++)md+=Math.abs(tp[j]-tm[i]);md/=20;return md?(v-tm[i])/(0.015*md):0});
const rc=c.map((v,i)=>i<12?0:v/c[i-12]-1),kU=e20.map((v,i)=>v+2*a10[i]),kL=e20.map((v,i)=>v-2*a10[i]);
const hh=(i,p)=>{let m=-Infinity;for(let j=i-p;j<i;j++)if(h[j]>m)m=h[j];return m},ll=(i,p)=>{let m=Infinity;for(let j=i-p;j<i;j++)if(l[j]<m)m=l[j];return m};
const cu=(x,y,i)=>x[i-1]<=y[i-1]&&x[i]>y[i],cd=(x,y,i)=>x[i-1]>=y[i-1]&&x[i]<y[i];
const R=[
['EMA 9/21 Cross + EMA200',i=>cu(e9,e21,i)&&c[i]>e200[i]?1:cd(e9,e21,i)&&c[i]<e200[i]?-1:0],
['EMA 20/50 Cross + EMA200',i=>cu(e20,e50,i)&&c[i]>e200[i]?1:cd(e20,e50,i)&&c[i]<e200[i]?-1:0],
['EMA 50/200 Cross',i=>cu(e50,e200,i)?1:cd(e50,e200,i)?-1:0],
['SMA 10/30 Cross',i=>cu(s10,s30,i)?1:cd(s10,s30,i)?-1:0],
['MACD Signal Cross',i=>cu(mc,ms,i)?1:cd(mc,ms,i)?-1:0],
['MACD Zero Cross',i=>mc[i-1]<=0&&mc[i]>0?1:mc[i-1]>=0&&mc[i]<0?-1:0],
['Supertrend 10/3 Flip',i=>t1.dir[i]!==t1.dir[i-1]?t1.dir[i]:0],
['Supertrend 10/2 Flip',i=>t2.dir[i]!==t2.dir[i-1]?t2.dir[i]:0],
['Donchian 20 Breakout + EMA200',i=>c[i]>hh(i,20)&&c[i]>e200[i]?1:c[i]<ll(i,20)&&c[i]<e200[i]?-1:0],
['Donchian 55 Breakout',i=>c[i]>hh(i,55)?1:c[i]<ll(i,55)?-1:0],
['ADX DI Cross (ADX>20)',i=>ad.adx[i]>20&&ad.pdi[i]>ad.mdi[i]&&ad.pdi[i-1]<=ad.mdi[i-1]?1:ad.adx[i]>20&&ad.pdi[i]<ad.mdi[i]&&ad.pdi[i-1]>=ad.mdi[i-1]?-1:0],
['ADX Rising Through 25',i=>ad.adx[i-1]<=25&&ad.adx[i]>25?(ad.pdi[i]>ad.mdi[i]?1:-1):0],
['RSI 30/70 Re-entry',i=>rs[i-1]<30&&rs[i]>=30?1:rs[i-1]>70&&rs[i]<=70?-1:0],
['RSI 50 Cross + EMA200',i=>rs[i-1]<=50&&rs[i]>50&&c[i]>e200[i]?1:rs[i-1]>=50&&rs[i]<50&&c[i]<e200[i]?-1:0],
['Bollinger Reversal',i=>c[i-1]<bb.lo[i-1]&&c[i]>bb.lo[i]?1:c[i-1]>bb.up[i-1]&&c[i]<bb.up[i]?-1:0],
['Bollinger Breakout + EMA200',i=>c[i-1]<=bb.up[i-1]&&c[i]>bb.up[i]&&c[i]>e200[i]?1:c[i-1]>=bb.lo[i-1]&&c[i]<bb.lo[i]&&c[i]<e200[i]?-1:0],
['Stochastic 20/80 Cross',i=>cu(K,D,i)&&K[i]<30?1:cd(K,D,i)&&K[i]>70?-1:0],
['CCI ±100 Re-entry',i=>cc[i-1]<-100&&cc[i]>=-100?1:cc[i-1]>100&&cc[i]<=100?-1:0],
['Pullback to EMA20 in Trend',i=>e20[i]>e50[i]&&e50[i]>e200[i]&&c[i-1]<=e20[i-1]&&c[i]>e20[i]?1:e20[i]<e50[i]&&e50[i]<e200[i]&&c[i-1]>=e20[i-1]&&c[i]<e20[i]?-1:0],
['Engulfing + EMA50 Trend',i=>c[i]>o[i]&&c[i-1]<o[i-1]&&c[i]>=o[i-1]&&o[i]<=c[i-1]&&c[i]>e50[i]?1:c[i]<o[i]&&c[i-1]>o[i-1]&&c[i]<=o[i-1]&&o[i]>=c[i-1]&&c[i]<e50[i]?-1:0],
['Keltner Breakout',i=>c[i]>kU[i]&&c[i-1]<=kU[i-1]?1:c[i]<kL[i]&&c[i-1]>=kL[i-1]?-1:0],
['ROC 12 Zero Cross + EMA200',i=>rc[i-1]<=0&&rc[i]>0&&c[i]>e200[i]?1:rc[i-1]>=0&&rc[i]<0&&c[i]<e200[i]?-1:0],
['10-Bar Break + EMA50 Slope',i=>c[i]>hh(i,10)&&c[i]>e50[i]&&e50[i]>e50[i-5]?1:c[i]<ll(i,10)&&c[i]<e50[i]&&e50[i]<e50[i-5]?-1:0],
['MACD Histogram Flip + EMA50',i=>hs[i-1]<=0&&hs[i]>0&&c[i]>e50[i]?1:hs[i-1]>=0&&hs[i]<0&&c[i]<e50[i]?-1:0],
['RSI(2) Mean Reversion',i=>rs2[i]<10&&c[i]>e200[i]?1:rs2[i]>90&&c[i]<e200[i]?-1:0]];
const dirs=R.map(([nm,f])=>{const d=new Array(n).fill(0);for(let i=205;i<n;i++)if(!isNaN(a[i]))d[i]=f(i)||0;return d});
const x={n,h,l,c,adx:ad.adx},reg=ad.adx[n-1]>=22?'t':'s',split=205+Math.floor((n-205)*.7),rows=[];
R.forEach(([nm],ri)=>RISK.forEach(([m,rr])=>{
const sg=new Array(n).fill(null);
for(let i=205;i<n;i++){const d=dirs[ri][i];if(!d)continue;const sl=c[i]-d*m*a[i],r=(c[i]-sl)*d;if(r>0&&isFinite(r)&&r<c[i]*.5)sg[i]={d,e:c[i],sl,tp:c[i]+d*r*rr}}
const tr=bt(sg,x,205),rg=tr.filter(t=>t.reg===reg),basis=rg.length>=8?'reg':'all',trn=stats(tr.filter(t=>t.i<split)),tst=stats(tr.filter(t=>t.i>=split)),all=stats(tr);
let act=null;for(let k2=n-1;k2>=n-3&&!act;k2--){const g=sg[k2];if(!g)continue;let ok=true;
for(let j=k2+1;j<n;j++){if(g.d>0?(l[j]<=g.sl||h[j]>=g.tp):(h[j]>=g.sl||l[j]<=g.tp)){ok=false;break}}
if(ok&&(g.d>0?(live>g.sl&&live<g.tp):(live<g.sl&&live>g.tp)))act={...g,ago:n-1-k2}}
rows.push({n:`${nm} (${m}×ATR, 1:${rr})`,all,trn,tst,cur:stats(basis==='reg'?rg:tr),basis,act,valid:all.n>=20&&trn.n>=8&&tst.n>=8&&trn.ex>0&&tst.ex>0})}));
return{live,n,reg,k:k.slice(-90),adx:ad.adx[n-1],up:ad.pdi[n-1]>ad.mdi[n-1],rows,days:Math.round(n*TH[st.tf]/24)}}

const kv=(t,v)=>`<div class="kv"><span>${t}</span><b>${v}</b></div>`,sx=v=>(v>=0?'+':'')+v.toFixed(2)+'R';
function sGrid(s){if(!s.n)return'<p class="note">No trades found in this data.</p>';
return`<div class="meter"><i style="width:${Math.round(s.wr*100)}%"></i><u></u></div><div class="grid">${kv('Win rate',Math.round(s.wr*100)+'%')}${kv('Profit factor',s.pf===null?'∞':s.pf.toFixed(2))}${kv('Avg result',sx(s.ex))}${kv('Max drawdown',s.dd.toFixed(1)+'R')}</div><p class="note">Based on ${s.n} trades${s.n<30?'. Small sample, so low reliability.':'.'}</p>`}
function plan(g){const r=Math.abs(g.e-g.sl),rw=Math.abs(g.tp-g.e)/r;
return`<div class="plan"><div><span>${g.d>0?'LONG entry':'SHORT entry'}</span><b>${fp(g.e)}</b></div><div><span>Stop-loss</span><b class="dn">${fp(g.sl)}</b></div><div><span>Target</span><b class="up">${fp(g.tp)}</b></div></div><p class="note">Stop distance ${(r/g.e*100).toFixed(2)}%, risk:reward 1:${rw.toFixed(1)}. Signal appeared ${g.ago} candle${g.ago===1?'':'s'} ago.</p>`}
const basisNote=r=>r.basis==='reg'?'Stats use only trades from the same kind of market as now (trending or sideways).':'Few trades in the current market type, so stats use all market conditions.';
const vNote=x=>`Training half ${x.trn.n?sx(x.trn.ex):'n/a'} per trade, test half ${x.tst.n?sx(x.tst.ex):'n/a'} per trade.`;

function drawChart(){const cv=$('#cv');if(!cv||!st.r)return;const r=st.r,k=r.k,d=window.devicePixelRatio||1,W=cv.clientWidth,H=260;
cv.width=W*d;cv.height=H*d;const g=cv.getContext('2d');g.scale(d,d);
const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim(),b=r.best&&r.best.act;
let hi=Math.max(...k.map(x=>x[2])),lo=Math.min(...k.map(x=>x[3]));
if(b){hi=Math.max(hi,b.tp,b.sl,b.e);lo=Math.min(lo,b.tp,b.sl,b.e)}
const pad=(hi-lo)*.06;hi+=pad;lo-=pad;const pw=62,cw=(W-pw)/k.length,y=v=>H-(v-lo)/(hi-lo)*H;
g.font='11px system-ui,sans-serif';g.textBaseline='middle';
for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g.strokeStyle=col('--ln');g.lineWidth=1;g.beginPath();g.moveTo(0,yy);g.lineTo(W-pw,yy);g.stroke();g.fillStyle=col('--mu');g.fillText(fp(v),W-pw+4,Math.min(H-7,Math.max(7,yy)))}
k.forEach((x,i)=>{const c=col(x[4]>=x[1]?'--up':'--dn'),cx=i*cw+cw/2;g.strokeStyle=c;g.fillStyle=c;g.lineWidth=1;g.beginPath();g.moveTo(cx,y(x[2]));g.lineTo(cx,y(x[3]));g.stroke();const t=y(Math.max(x[1],x[4])),b2=y(Math.min(x[1],x[4]));g.fillRect(cx-cw*.35,t,cw*.7,Math.max(1,b2-t))});
if(b)[['Entry',b.e,'--tx'],['SL',b.sl,'--dn'],['TP',b.tp,'--up']].forEach(([n,v,c])=>{const yy=y(v);g.strokeStyle=col(c);g.setLineDash([6,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(0,yy);g.lineTo(W-pw,yy);g.stroke();g.setLineDash([]);g.fillStyle=col(c);g.fillRect(W-pw,yy-8,pw,16);g.fillStyle=col('--pn');g.fillText(n+' '+fp(v),W-pw+3,yy)})}

const cmp=(p,q)=>(q.valid-p.valid)||((q.cur.ex??-9)-(p.cur.ex??-9));
function render(){
$('#t-live').className=st.tab==='live'?'on':'';$('#t-str').className=st.tab==='str'?'on':'';
const chips=Object.keys(A).map(k=>`<button class="chip${k===st.a?' on':''}" onclick="setA('${k}')">${k}</button>`).join('');
const tfs=Object.keys(TF).map(k=>`<button class="chip${k===st.tf?' on':''}" onclick="setTF('${k}')">${TF[k]}</button>`).join('');
let h=`<div class="mu">${A[st.a][1]}, ${TF[st.tf]} chart</div><div class="chips">${chips}</div><div class="chips s">${tfs}</div>`;
const r=st.r;
if(st.busy||!r){$('#app').innerHTML=h+'<p class="mu" style="margin-top:20px">Loading data and testing 100 strategies…</p>';return}
if(r.demo)h+='<div class="warn">Demo data: not real market prices, for previewing the design only.</div>';
const act=r.rows.filter(x=>x.act).sort(cmp),val=act.filter(x=>x.valid),best=val[0]||null;r.best=best;
if(st.tab==='live'){
h+=`<div class="price">${fp(r.live)}</div><span class="reg">${r.reg==='t'?(r.up?'Trending up':'Trending down'):'Sideways'}</span> <span class="mu">ADX ${r.adx.toFixed(1)}</span><canvas id="cv"></canvas>`;
h+=`<p class="mu">Scanned ${r.rows.length} strategies on about ${r.days} days of data. Active now: ${val.length} validated, ${act.length-val.length} unvalidated.</p>`;
if(best)h+=`<div class="card best"><h2>Best validated setup right now</h2><div class="hd"><b>${best.n}</b></div>${plan(best.act)}${sGrid(best.cur)}<p class="note">${basisNote(best)} ${vNote(best)}</p></div>`;
else h+='<div class="card"><b>No validated setup right now.</b><p class="note">Waiting is also a decision. Refresh after the next candle closes, or try another timeframe or coin.</p></div>';
const oth=act.filter(x=>x!==best).slice(0,6);
if(oth.length)h+='<p class="mu" style="margin-top:18px">Other active setups</p>';
oth.forEach(x=>{h+=`<div class="card act"><div class="hd"><b>${x.n}</b><span class="tag${x.valid?' on':''}">${x.valid?'Validated':'Unvalidated'}</span></div>${plan(x.act)}${sGrid(x.cur)}</div>`})}
else{
const tb=r.rows.filter(x=>!st.vo||x.valid).sort((p,q)=>(q.valid-p.valid)||((q.all.ex??-9)-(p.all.ex??-9)));
h+=`<p class="mu" style="margin-top:16px">Backtest on about ${r.days} days of ${TF[st.tf]} candles for ${A[st.a][1]}. ${r.rows.filter(x=>x.valid).length} of ${r.rows.length} strategies are validated.</p>`;
h+=`<div class="chips"><button class="chip${st.vo?' on':''}" onclick="st.vo=!st.vo;render()">Validated only</button></div><div class="tbl"><div class="tr h"><span>Strategy</span><span>Trades</span><span>Win</span><span>PF</span><span>Avg R</span></div>`;
tb.forEach(x=>{const s=x.all;h+=`<div class="tr"><span class="${x.valid?'v':''}">${x.n}</span><span>${s.n}</span><span>${s.n?Math.round(s.wr*100)+'%':'-'}</span><span>${s.n?(s.pf===null?'∞':s.pf.toFixed(1)):'-'}</span><span>${s.n?sx(s.ex):'-'}</span></div>`});
h+='</div><div class="card"><b>What “validated” means</b><p class="note">A strategy is validated when it made at least 20 trades and was profitable in both the first 70% (training) and the last 30% (test) of the data. With 100 strategies, some will look good by luck alone, so validated is a filter, not a guarantee. Green names are validated. R is the amount risked up to the stop-loss, PF is profit factor.</p></div>'}
h+='<p class="foot">Educational analysis only, not investment advice. Past results may not repeat. Trading carries a risk of loss. Gold uses the PAXG token price.</p>';
$('#app').innerHTML=h;if(st.tab==='live')drawChart()}

function go(t){st.tab=t;render();scrollTo(0,0)}
function setA(k){st.a=k;load()}
function setTF(v){st.tf=v;load()}
async function load(q){if(!q){st.busy=true;render()}const key=st.a,tf=st.tf,g=await getK(key,tf);if(key!==st.a||tf!==st.tf)return;st.r=analyze(g.k);st.r.demo=g.demo;st.busy=false;render()}
addEventListener('resize',()=>{if(st.tab==='live'&&st.r&&!st.busy)drawChart()});
setInterval(()=>{if(!st.busy&&st.tab==='live'&&!document.hidden)load(true)},60000);
load();
</script>
</body>
</html>
